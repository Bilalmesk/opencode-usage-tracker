<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <title>OpenCode Usage · Widget</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%238b5cf6'/%3E%3Cpath d='M9 21V11l7 5 7-5v10' fill='none' stroke='white' stroke-width='2.4' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E"
    />
    <style>
      :root {
        color-scheme: dark;
        --panel: #10131b;
        --line: #222838;
        --text: #e9edf7;
        --muted: #98a2b8;
        --faint: #6b7488;
        --good: #34d399;
        --warn: #fbbf24;
        --bad: #fb7185;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        margin: 0;
        padding: 0;
        background: transparent;
      }

      body {
        font-family:
          "Inter var", Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        color: var(--text);
        display: grid;
        place-items: center;
        min-height: 100vh;
        padding: 14px;
      }

      body.solid {
        background:
          radial-gradient(600px 280px at 20% 0%, rgba(139, 92, 246, 0.2), transparent 65%),
          #07090e;
      }

      .widget {
        width: 100%;
        max-width: 360px;
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.035), rgba(255, 255, 255, 0.005)),
          var(--panel);
        border: 1px solid var(--line);
        border-radius: 16px;
        padding: 16px;
        box-shadow: 0 24px 60px -30px rgba(0, 0, 0, 0.95);
      }

      .top {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        margin-bottom: 13px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 9px;
        min-width: 0;
      }

      .mark {
        width: 27px;
        height: 27px;
        border-radius: 8px;
        background: linear-gradient(150deg, #8b5cf6, #6d3ef0 55%, #22d3ee);
        display: grid;
        place-items: center;
        flex: 0 0 auto;
      }

      .mark svg {
        width: 16px;
        height: 16px;
      }

      .brand a {
        color: var(--text);
        text-decoration: none;
        font-size: 12.5px;
        font-weight: 640;
        letter-spacing: -0.01em;
        white-space: nowrap;
      }

      .brand a:hover {
        color: #c4b5fd;
      }

      .status {
        display: inline-flex;
        align-items: center;
        gap: 6px;
        font-size: 10px;
        font-weight: 640;
        text-transform: uppercase;
        letter-spacing: 0.07em;
        color: var(--muted);
        border: 1px solid var(--line);
        background: rgba(255, 255, 255, 0.03);
        border-radius: 999px;
        padding: 4px 8px;
        white-space: nowrap;
      }

      .dot {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: var(--faint);
      }

      .status.good .dot {
        background: var(--good);
        box-shadow: 0 0 0 3px rgba(52, 211, 153, 0.14);
      }

      .status.warn .dot {
        background: var(--warn);
        box-shadow: 0 0 0 3px rgba(251, 191, 36, 0.14);
      }

      .status.bad .dot {
        background: var(--bad);
        box-shadow: 0 0 0 3px rgba(251, 113, 133, 0.16);
        animation: pulse 1.8s ease-in-out infinite;
      }

      @keyframes pulse {
        50% {
          opacity: 0.4;
        }
      }

      .usage {
        display: flex;
        align-items: baseline;
        gap: 7px;
        margin-bottom: 2px;
      }

      .big {
        font-size: 38px;
        font-weight: 680;
        letter-spacing: -0.04em;
        line-height: 1;
        font-variant-numeric: tabular-nums;
      }

      .of {
        color: var(--faint);
        font-size: 12.5px;
        font-variant-numeric: tabular-nums;
      }

      .caption {
        color: var(--muted);
        font-size: 11.5px;
        margin-bottom: 11px;
      }

      .meter {
        height: 7px;
        border-radius: 999px;
        background: #1b2130;
        overflow: hidden;
        margin-bottom: 7px;
      }

      .fill {
        height: 100%;
        width: 0;
        border-radius: 999px;
        background: linear-gradient(90deg, #6d3ef0, #8b5cf6 55%, #22d3ee);
        transition: width 0.5s ease;
      }

      .fill.warn {
        background: linear-gradient(90deg, #d69e22, #fbbf24);
      }

      .fill.bad {
        background: linear-gradient(90deg, #e11d48, #fb7185);
      }

      .hint {
        display: flex;
        align-items: baseline;
        justify-content: space-between;
        gap: 10px;
        color: var(--faint);
        font-size: 10.8px;
        font-variant-numeric: tabular-nums;
        margin-bottom: 13px;
      }

      .hint strong {
        color: var(--muted);
        font-weight: 600;
      }

      .split {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
        border-top: 1px solid var(--line);
        padding-top: 12px;
      }

      .tokline {
        border-top: 1px solid var(--line);
        margin-top: 11px;
        padding-top: 10px;
        color: var(--faint);
        font-size: 10px;
        line-height: 1.5;
        font-variant-numeric: tabular-nums;
      }

      .cell .lbl {
        color: var(--faint);
        font-size: 9.5px;
        text-transform: uppercase;
        letter-spacing: 0.08em;
        font-weight: 620;
        margin-bottom: 2px;
      }

      .cell .val {
        font-size: 14px;
        font-weight: 620;
        font-variant-numeric: tabular-nums;
      }

      .cell .sub {
        color: var(--faint);
        font-size: 10px;
        font-variant-numeric: tabular-nums;
      }

      .cell.right {
        text-align: right;
      }

      .reset-val {
        font-size: 17px;
        font-weight: 650;
        letter-spacing: -0.02em;
        font-variant-numeric: tabular-nums;
      }

      .error {
        color: var(--bad);
        font-size: 11.5px;
        padding: 10px 0;
      }

      .hidden {
        display: none !important;
      }

      /* ---------------- V2 widget skin ---------------- */

      body.solid {
        background:
          radial-gradient(720px 360px at 14% -6%, rgba(139, 92, 246, 0.28), transparent 62%),
          radial-gradient(600px 320px at 100% 100%, rgba(34, 211, 238, 0.12), transparent 64%),
          #07090e;
      }

      .widget {
        position: relative;
        max-width: 382px;
        padding: 18px;
        border-radius: 22px;
        border: 1px solid rgba(139, 92, 246, 0.28);
        background:
          linear-gradient(180deg, rgba(255, 255, 255, 0.055), rgba(255, 255, 255, 0.008)),
          rgba(15, 18, 27, 0.9);
        box-shadow:
          0 35px 90px -40px rgba(0, 0, 0, 0.95),
          inset 0 1px 0 rgba(255, 255, 255, 0.06);
        overflow: hidden;
      }

      .widget::before {
        content: "";
        position: absolute;
        inset: 0 0 auto 0;
        height: 1px;
        background: linear-gradient(90deg, transparent, rgba(139, 92, 246, 0.9), rgba(34, 211, 238, 0.8), transparent);
      }

      .widget::after {
        content: "";
        position: absolute;
        width: 210px;
        height: 210px;
        right: -90px;
        top: -120px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(139, 92, 246, 0.2), transparent 68%);
        pointer-events: none;
      }

      .top {
        margin-bottom: 15px;
      }

      .brand {
        gap: 10px;
      }

      .brand a {
        font-size: 13.5px;
        font-weight: 660;
      }

      .plan-chip {
        display: inline-flex;
        align-items: center;
        gap: 5px;
        border: 1px solid rgba(139, 92, 246, 0.3);
        background: rgba(139, 92, 246, 0.12);
        color: #d8ccff;
        font-size: 9.5px;
        font-weight: 650;
        letter-spacing: 0.06em;
        text-transform: uppercase;
        border-radius: 999px;
        padding: 3px 7px;
      }

      .big {
        font-size: 43px;
      }

      .caption {
        margin-bottom: 9px;
      }

      .mini-traffic {
        display: flex;
        height: 6px;
        border-radius: 999px;
        overflow: hidden;
        background: #1b2130;
        margin: 0 0 10px;
      }

      .mini-traffic i {
        display: block;
        height: 100%;
        min-width: 2px;
        transition: width 0.4s ease;
      }

      .meter {
        height: 8px;
        background: rgba(255, 255, 255, 0.07);
      }

      .fill {
        background: linear-gradient(90deg, #6d3ef0, #8b5cf6 45%, #22d3ee);
      }

      .hint {
        margin-top: 2px;
      }

      .split {
        margin-top: 2px;
      }

      .cell .val {
        font-size: 15px;
      }

      .tokline {
        border-top-color: rgba(255, 255, 255, 0.08);
      }

      .status {
        border-color: rgba(255, 255, 255, 0.1);
      }
    </style>
  </head>
  <body class="solid">
    <div class="widget">
      <div class="top">
        <div class="brand">
          <div class="mark" aria-hidden="true">
            <svg viewBox="0 0 32 32" fill="none">
              <path
                d="M8 22V10l8 6 8-6v12"
                stroke="white"
                stroke-width="2.8"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </div>
          <a href="/" target="_blank" rel="noreferrer" title="Open the full dashboard">OpenCode Usage</a>
          <span class="plan-chip" id="planChip">–</span>
        </div>
        <span class="status" id="status"><span class="dot"></span><span id="statusText">…</span></span>
      </div>

      <div id="error" class="error hidden">Could not read usage data.</div>

      <div id="content">
        <div class="usage">
          <span class="big" id="used">–</span>
          <span class="of" id="rate">–</span>
        </div>
        <div class="caption" id="caption">free requests in the current 24h window</div>
        <div class="mini-traffic" id="miniTraffic" aria-hidden="true"></div>
        <div class="meter"><div class="fill" id="fill"></div></div>
        <div class="hint">
          <span id="hintLeft">–</span>
          <strong id="hintRight">–</strong>
        </div>
        <div class="split">
          <div class="cell">
            <div class="lbl">Resets in</div>
            <div class="reset-val" id="reset">–</div>
            <div class="sub" id="resetAt">waiting for data</div>
          </div>
          <div class="cell right">
            <div class="lbl">Window tokens</div>
            <div class="val" id="tokens">–</div>
            <div class="sub" id="value">–</div>
          </div>
        </div>
        <div class="tokline" id="tokenTotals">–</div>
      </div>
    </div>

    <script src="/palette.js"></script>

    <script>
      "use strict";

      const $ = (id) => document.getElementById(id);
      const nfInt = new Intl.NumberFormat();
      const nf1 = new Intl.NumberFormat(undefined, { maximumFractionDigits: 1 });
      const nfCompact = new Intl.NumberFormat(undefined, { notation: "compact", maximumFractionDigits: 1 });

      const fmtInt = (v) => nfInt.format(Math.round(Number(v) || 0));
      const fmtCompact = (v) => nfCompact.format(Number(v) || 0);

      function fmtUsd(v) {
        const x = Number(v) || 0;
        if (x === 0) return "$0.00";
        return "$" + (x >= 10 ? x.toFixed(2) : x.toFixed(3));
      }

      function fmtDuration(ms) {
        if (!Number.isFinite(ms) || ms <= 0) return "0s";
        const total = Math.floor(ms / 1000);
        const days = Math.floor(total / 86400);
        const hours = Math.floor((total % 86400) / 3600);
        const minutes = Math.floor((total % 3600) / 60);
        const seconds = total % 60;
        if (days > 0) return `${days}d ${hours}h`;
        if (hours > 0) return `${hours}h ${minutes}m`;
        if (minutes > 0) return `${minutes}m ${seconds}s`;
        return `${seconds}s`;
      }

      if (new URLSearchParams(location.search).get("transparent") === "1") {
        document.body.classList.remove("solid");
      }

      let data = null;

      const providerColor = (provider) =>
        window.ocProviderColor ? window.ocProviderColor(provider) : "#8b5cf6";

      function renderPlanAndTraffic(next) {
        const all = next.all || {};
        const go = next.go || {};
        const chip = $("planChip");
        if (chip) {
          chip.textContent = go.detected
            ? "Go"
            : all.providerCount > 1
              ? `${all.providerCount} providers`
              : "Free";
        }
        const traffic = $("miniTraffic");
        if (!traffic) return;
        traffic.textContent = "";
        for (const provider of (all.providers || []).slice(0, 6)) {
          const share = Math.max(0, Math.min(100, provider.sharePct || 0));
          if (share <= 0) continue;
          const segment = document.createElement("i");
          segment.style.width = `${share}%`;
          segment.style.background = providerColor(provider);
          traffic.append(segment);
        }
        traffic.classList.toggle("hidden", traffic.childElementCount === 0);
      }

      /**
       * Go plan mode. The widget's primary number becomes the month meter
       * (the tightest long-lived budget) and the two smaller meters are shown
       * in the hint line. Returns true when it handled the widget.
       */
      function renderGoWidget(next) {
        const go = next.go || {};
        if (go.detected !== true) return false;

        const plan = go.plan || {};
        const meters = go.meters || {};
        const month = meters.month || null;
        const activity = go.activity || null;
        document.title = "OpenCode Go Usage · Widget";
        const brandLink = document.querySelector(".brand a");
        if (brandLink) brandLink.textContent = "OpenCode Go";
        const local = go.local || {};
        const localToday = local.today || { requests: 0, tokens: { total: 0 } };
        const totals = next.totals || {};
        const seven = totals.last7Days && totals.last7Days.tokens ? totals.last7Days.tokens.total : null;
        const thirty = totals.last30Days && totals.last30Days.tokens ? totals.last30Days.tokens.total : null;

        $("used").textContent = month ? fmtUsd(month.usedUsd) : fmtInt(localToday.requests);
        $("rate").textContent = month ? `/ ${fmtUsd(month.limitUsd)}` : "";
        $("caption").textContent = month
          ? `${plan.productName || "Go"} · month meter · ${fmtUsd(month.remainingUsd)} left`
          : `${plan.productName || "Go"} · requests today from the local database`;

        const pct = month && Number.isFinite(month.percent) ? month.percent : 0;
        $("fill").style.width = `${Math.min(100, Math.max(0, pct))}%`;
        $("fill").className = "fill" + (pct >= 100 ? " bad" : pct >= 90 ? " warn" : "");

        if (month) {
          const five = meters.fiveHour;
          const week = meters.week;
          $("hintLeft").textContent =
            (five ? `5h ${five.percent == null ? "–" : nf1.format(five.percent) + "%"}` : "") +
            (week ? `${five ? " · " : ""}wk ${week.percent == null ? "–" : nf1.format(week.percent) + "%"}` : "") ||
            "meters live";
          $("hintRight").textContent = `${nf1.format(pct)}% of month`;
          const resetAt = month.resetsAt ? new Date(month.resetsAt) : null;
          $("reset").textContent = resetAt
            ? resetAt.getTime() > Date.now()
              ? fmtDuration(resetAt.getTime() - Date.now())
              : "resetting…"
            : "–";
          $("resetAt").textContent = resetAt
            ? `Go month resets ${resetAt.toLocaleDateString([], { month: "short", day: "numeric" })}`
            : "Go month reset unknown";
          $("resetAt").title = "Exact Go month meter reset from Console.";
          $("tokens").textContent = fmtCompact(
            activity && activity.totals ? activity.totals.tokens : localToday.tokens.total,
          ) + " tok";
          $("value").textContent = activity && activity.totals
            ? `${fmtInt(activity.totals.requests)} req · ${fmtUsd(activity.totals.costUsd)}`
            : `${fmtInt(localToday.requests)} req today`;
        } else {
          $("hintLeft").textContent = "local count only";
          $("hintRight").textContent = "Console meters unavailable";
          $("reset").textContent = "–";
          $("resetAt").textContent = "Add console.cookie to read exact Go meters";
          $("resetAt").removeAttribute("title");
          $("tokens").textContent = fmtCompact(localToday.tokens.total) + " tok";
          $("value").textContent = `${fmtInt(localToday.requests)} req today`;
        }

        const all = next.all || {};
        const allExtra =
          all.detected && (all.providerCount || 0) > 1
            ? ` · All ${fmtInt(all.today ? all.today.requests : 0)} req today`
            : "";
        $("tokenTotals").textContent =
          (month ? "Go meter is money, not requests · " : "") +
          (seven != null
            ? `Free token totals 7d ${fmtCompact(seven)} · 30d ${fmtCompact(thirty)}`
            : "Free token totals unavailable") +
          allExtra;

        const status = $("status");
        status.className = "status";
        status.classList.add(month ? (pct >= 100 ? "bad" : pct >= 90 ? "warn" : "good") : "warn");
        $("statusText").textContent = month
          ? pct >= 100
            ? "Go limit"
            : pct >= 90
              ? "Go near limit"
              : "Go plan"
          : "Go · local";
        if (go.error) {
          $("resetAt").textContent += " · " + go.error;
        }
        tick();
        return true;
      }

      /** Non-Go paid/external providers: show the all-provider view. */
      function renderAllWidget(next) {
        const all = next.all || {};
        const kinds = all.kinds || [];
        if (all.detected !== true) return false;
        if ((all.providerCount || 0) < 2 && !kinds.some((kind) => kind !== "free")) return false;

        const today = all.today || {};
        const providers = all.providers || [];
        document.title = "OpenCode Usage · Widget";
        const brandLink = document.querySelector(".brand a");
        if (brandLink) brandLink.textContent = "OpenCode Usage";

        $("used").textContent = fmtInt(today.requests);
        $("rate").textContent = fmtUsd(today.costUsd);
        $("caption").textContent = `requests today · ${all.providerCount} providers/plans`;
        $("fill").style.width = "0%";
        $("fill").className = "fill";
        $("hintLeft").textContent = `${fmtCompact(today.tokens ? today.tokens.total : 0)} tok today`;
        $("hintRight").textContent = "local usage only";
        $("reset").textContent = "–";
        $("resetAt").textContent = "No shared quota API for these providers";
        $("resetAt").removeAttribute("title");
        $("tokens").textContent = fmtCompact(today.tokens ? today.tokens.total : 0) + " tok";
        $("value").textContent = fmtUsd(today.costUsd) + " local cost";
        $("tokenTotals").textContent = providers
          .slice(0, 3)
          .map((provider) => `${provider.providerName} ${fmtInt(provider.today.requests)}`)
          .join(" · ");

        const status = $("status");
        status.className = "status good";
        $("statusText").textContent = `${all.providerCount} providers`;
        tick();
        return true;
      }

      function render(next) {
        data = next;
        if (next.error) {
          $("error").classList.remove("hidden");
          $("content").classList.add("hidden");
          $("statusText").textContent = "Error";
          $("status").className = "status bad";
          return;
        }
        $("error").classList.add("hidden");
        $("content").classList.remove("hidden");

        renderPlanAndTraffic(next);
        if (renderGoWidget(next)) return;
        if (renderAllWidget(next)) return;

        const win = next.window || {};
        const used = Number.isFinite(win.usedRequests) ? win.usedRequests : next.today.requests;
        const limited = next.meta.status === "limited";
        const estimate = next.limit && next.limit.estimates ? next.limit.estimates.requests : null;
        const history = estimate && estimate.source === "history";

        $("used").textContent = fmtInt(used);
        $("rate").textContent = next.today.requests !== used ? `· ${fmtInt(next.today.requests)} UTC today` : "";
        $("caption").textContent =
          (limited
            ? "free requests · server refused the last one"
            : "free requests in the current 24h window") +
          (win.usedSource === "server" ? " · account-wide count" : " · local count");

        // The bar matches the dashboard: observed usage against the last
        // refused window. That boundary is historical, not the unpublished
        // server cap, so the ratio can pass 100%.
        const boundary =
          win.lastRefusal && Number.isFinite(win.lastRefusal.requests) && win.lastRefusal.requests > 0
            ? win.lastRefusal.requests
            : null;
        const headroom = Number.isFinite(win.headroomRequests) ? win.headroomRequests : null;
        const progress = Math.max(0, Math.min(1, Number(next.meta.windowProgress) || 0));
        const ratio = boundary ? Math.min(1, used / boundary) : progress;
        $("fill").style.width = (ratio * 100).toFixed(1) + "%";
        $("fill").className = "fill" + (limited ? " bad" : ratio >= 0.9 ? " warn" : "");

        $("hintLeft").textContent = limited
          ? "limit reached"
          : boundary
            ? `${fmtInt(used)} vs ${fmtInt(boundary)} at last refusal`
            : `${Math.round(progress * 100)}% of 24h window`;
        $("hintRight").textContent =
          headroom != null
            ? `${fmtInt(headroom)} to last boundary`
            : history && estimate.likely > 0
              ? `past refusals ~${fmtInt(estimate.likely)}`
              : "quota not published";

        $("tokens").textContent = fmtCompact(
          Number.isFinite(win.usedTokens) ? win.usedTokens : next.today.tokens.total,
        ) + " tok";
        $("value").textContent = fmtUsd(
          Number.isFinite(win.usedListValue) ? win.usedListValue : next.today.listValue,
        ) + " list value";

        const totals = next.totals || {};
        const seven = totals.last7Days && totals.last7Days.tokens ? totals.last7Days.tokens.total : null;
        const thirty = totals.last30Days && totals.last30Days.tokens ? totals.last30Days.tokens.total : null;
        const tracked = totals.tracked && totals.tracked.tokens ? totals.tracked.tokens.total : null;
        $("tokenTotals").textContent =
          seven != null
            ? `Token totals · 7d ${fmtCompact(seven)} · 30d ${fmtCompact(thirty)} · all ${fmtCompact(tracked)}`
            : "Token totals unavailable";

        const status = next.meta.status;
        $("status").className = "status";
        let label = "Active";
        if (status === "limited") {
          $("status").classList.add("bad");
          label = "At limit";
        } else if (status === "limit-banner") {
          $("status").classList.add("warn");
          label = "Recovered";
        } else if (status === "unknown") {
          label = "Idle";
        } else {
          $("status").classList.add("good");
          label = "Active";
        }
        $("statusText").textContent = label;

        const reset = next.meta.resetAt ? new Date(next.meta.resetAt) : null;
        if (reset) {
          const utc = reset.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
          const local = reset.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
          const when = local === utc ? `${utc} UTC` : `${utc} UTC · ${local} local`;
          const day = reset.toDateString() !== new Date().toDateString()
            ? " " + reset.toLocaleDateString([], { month: "short", day: "numeric" })
            : "";
          $("resetAt").textContent =
            (next.meta.resetSource === "server"
              ? "OpenCode-confirmed · "
              : next.meta.resetSource === "estimated"
                ? "estimated latest · "
                : "projected · ") + when + day;

          const range = next.window && next.window.resetRange;
          if (range && range.earliest && range.latest && next.meta.resetSource !== "server") {
            const fmtRange = (date) =>
              date.toLocaleDateString([], { month: "short", day: "numeric", timeZone: "UTC" }) +
              " " +
              date.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit", timeZone: "UTC" });
            $("resetAt").title = `Possible reset ${fmtRange(
              new Date(range.earliest),
            )} – ${fmtRange(new Date(range.latest))} UTC`;
          } else {
            $("resetAt").removeAttribute("title");
          }
        } else {
          $("resetAt").textContent = next.window && next.window.anchorAt ? "unknown" : "no window yet";
          $("resetAt").removeAttribute("title");
        }
        tick();
      }

      function tick() {
        if (!data || data.error) return;
        const go = data.go;
        const month = go && go.detected === true && go.meters ? go.meters.month : null;
        if (month && month.resetsAt) {
          const goReset = Date.parse(month.resetsAt);
          $("reset").textContent =
            goReset > Date.now() ? fmtDuration(goReset - Date.now()) : "resetting…";
          return;
        }
        if (data.meta && data.meta.plan === "paid") {
          $("reset").textContent = "–";
          return;
        }
        const resetAt = Date.parse(data.meta.resetAt);
        if (Number.isFinite(resetAt)) {
          $("reset").textContent =
            resetAt > Date.now()
              ? fmtDuration(resetAt - Date.now())
              : data.meta.resetSource === "server"
                ? "resetting…"
                : "estimate passed";
        } else {
          $("reset").textContent = "–";
        }
      }

      async function load(force) {
        try {
          const res = await fetch("/api/usage" + (force ? "?refresh=1" : ""), { cache: "no-store" });
          render(await res.json());
        } catch {
          $("error").classList.remove("hidden");
        }
      }

      setInterval(tick, 1000);
      setInterval(() => load(false), 5000);
      load(false);
    </script>
  </body>
</html>
